[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 100000
bytecode_hash = "none"
evm_version = "cancun"
dynamic_test_linking = true
#  5740 unreachable-code  — MYTStrategy base template: its virtual _allocate/_deallocate
#                           hooks all revert, so the post-dispatch code is provably dead.
#  5667 unused-parameter  — the adapter ABI forces selector/sender/amount params that
#                           some base implementations don't use.
ignored_error_codes = [5740, 5667]
fs_permissions = [
  { access = "read-write", path = "./script" },
  { access = "read", path = "./test/data" }
]

[profile.default.fmt]
wrap_comments = true

[profile.default.lint]
exclude_lints = [
    "screaming-snake-case-immutable",
    "asm-keccak256",
    "block-timestamp",
]
ignore = [
    'test/**/*.sol',
    'src/adapters/MYTStrategy.sol',
    'src/adapters/interfaces/IMYTStrategy.sol',
    'src/libraries/TokenUtils.sol',
    'src/interfaces/IERC20Burnable.sol',
    'src/interfaces/IERC20Mintable.sol',
]

[profile.no_via_ir]
via_ir = false

[fuzz]
runs = 2048

[[profile.default.compilation_restrictions]]
paths = "src/imports/MorphoImport.sol"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.compilation_restrictions]]
paths = "src/imports/MetaMorphoV1_1Import.sol"
optimizer_runs = 200
evm_version = "cancun"

[[profile.default.compilation_restrictions]]
paths = "src/imports/MetaMorphoImport.sol"
optimizer_runs = 200
evm_version = "cancun"

# For every restriction above there must be some compatible foundry profile.
# The first matching profile will be used. For clarity, all profiles below should be incompatible with each other.

[[profile.default.additional_compiler_profiles]]
name = "999999-paris"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.additional_compiler_profiles]]
name = "200-cancun"
optimizer_runs = 200
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
